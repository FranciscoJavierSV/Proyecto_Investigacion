global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: consumer
    static_configs:
      - targets: ["consumer:9464"]

  - job_name: api-comparison
    static_configs:
      - targets: ["api-comparison:4000"]

  - job_name: research-api
    static_configs:
      - targets: ["research-api:4000"]
