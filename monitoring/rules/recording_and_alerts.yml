groups:
  - name: basedr-recording-rules
    rules:
      # Recording rules for request and DB fetch latency (preserve api_type label)
      - record: http_request_duration_ms_p95
        expr: >-
          histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le, api_type))
      - record: http_request_duration_ms_p99
        expr: >-
          histogram_quantile(0.99, sum(rate(http_request_duration_ms_bucket[5m])) by (le, api_type))
      - record: db_fetch_duration_ms_p95
        expr: >-
          histogram_quantile(0.95, sum(rate(db_fetch_duration_ms_bucket[5m])) by (le, api_type))
      - record: db_fetch_duration_ms_p99
        expr: >-
          histogram_quantile(0.99, sum(rate(db_fetch_duration_ms_bucket[5m])) by (le, api_type))

  - name: basedr-alerting-rules
    rules:
      # High HTTP latency (p95) alert
      - alert: HighHttpP95
        expr: http_request_duration_ms_p95 > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP p95 > 500ms for {{ $labels.api_type }}"
          description: "Request p95 is above 500ms for api_type={{ $labels.api_type }}."

      # High DB fetch latency (p95)
      - alert: HighDBFetchP95
        expr: db_fetch_duration_ms_p95 > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB fetch p95 > 500ms for {{ $labels.api_type }}"
          description: "DB fetch p95 is above 500ms for api_type={{ $labels.api_type }}."

      # High error rate (percentage of errors over total requests)
      - alert: HighErrorRate
        expr: (sum(rate(errors_total[5m])) by (api_type) / sum(rate(http_requests_total[5m])) by (api_type)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate (>0.05) for {{ $labels.api_type }}"
          description: "Errors/total requests > 5% for api_type={{ $labels.api_type }}."

      # Consumer missing or not scraped
      - alert: ConsumerDown
        expr: up{job="consumer"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Consumer job is down or not scraped"
          description: "Prometheus reports consumer job down or missing."
