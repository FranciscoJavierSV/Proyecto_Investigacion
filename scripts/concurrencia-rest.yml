config:
  target: "{{ $processEnvironment.TARGET_URL }}"
  phases:
    - duration: "{{ $processEnvironment.DURATION }}"
      arrivalRate: "{{ $processEnvironment.RATE }}"
      name: "Prueba de carga REST - {{ $processEnvironment.RATE }} req/sec por {{ $processEnvironment.DURATION }}s"
scenarios:
  - name: "Consultar REST"
    flow:
      - get:
          url: "/rest/?size=50&offset=0"
          expect:
            - statusCode: 200
# Run: npx artillery run scripts/concurrencia-rest.yml -o logs/artillery_rest.json
