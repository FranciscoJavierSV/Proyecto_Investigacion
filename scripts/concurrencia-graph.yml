config:
  target: "{{ $processEnvironment.TARGET_URL }}"
  phases:
    - duration: "{{ $processEnvironment.DURATION }}"
      arrivalRate: "{{ $processEnvironment.RATE }}"
      name: "Prueba de carga GraphQL - {{ $processEnvironment.RATE }} req/sec por {{ $processEnvironment.DURATION }}s"

scenarios:
  - name: "Consultar GraphQL"
    flow:
      - post:
          url: "/graphql"
          json:
            query: |
              query {
                obtenerDataset(input: { limit: 50 }) {
                  tiempoMs
                  clientes {
                    data { _id }
                  }
                }
              }
          expect:
            - statusCode: 200

# Run: npx artillery run scripts/concurrencia-graph.yml -o logs/artillery_graph.json
