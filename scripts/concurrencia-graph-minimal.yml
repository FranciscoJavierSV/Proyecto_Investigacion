config:
  target: "{{ $processEnvironment.TARGET_URL }}"
  phases:
    - duration: "{{ $processEnvironment.DURATION }}"
      arrivalRate: "{{ $processEnvironment.RATE }}"
      name: "GraphQL minimal fields - {{ $processEnvironment.RATE }} req/sec por {{ $processEnvironment.DURATION }}s"

scenarios:
  - name: "GraphQL minimal"
    flow:
      - post:
          url: "/graphql"
          json:
            query: |
              query {
                obtenerDataset(input: { limit: 50 }) {
                  clientes {
                    data {
                      _id nombre correo
                    }
                  }
                }
              }
          expect:
            - statusCode: 200

# Run: npx artillery run scripts/concurrencia-graph-minimal.yml -o logs/artillery_graph_minimal.json
